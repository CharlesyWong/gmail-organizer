# Classification rules for gmail-organizer.
#
# First matching rule wins. Within a condition, list entries are ORed.
# Across conditions the default is AND; use `match: any` when any populated
# condition may match. All matching is case-insensitive.
#
# Validate after editing:
#   python -m gmail_organizer check-config

label_prefix: "Auto"
label_unmatched: false

rules:
  - name: recruiting
    category: Recruiting
    match: any
    when:
      from_domains:
        - linkedin.com
        - greenhouse.io
        - lever.co
        - workday.com
        - myworkdayjobs.com
      from_contains:
        - talent
        - recruiter
        - careers
      subject_contains_any:
        - job application
        - application received
        - interview invitation
        - recruiter

